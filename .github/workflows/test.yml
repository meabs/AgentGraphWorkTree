name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest tree-sitter tree-sitter-java tree-sitter-typescript
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m pytest -q
        working-directory: .apm/skills/agent-graph/tool
      - name: Installer smoke test
        shell: bash
        run: |
          mkdir proj && cd proj && git init -q
          mkdir -p src/main/java/demo
          printf 'package demo;\n\npublic class A {\n\tpublic int one() { return new B().two(); }\n}\n' > src/main/java/demo/A.java
          printf 'package demo;\n\npublic class B {\n\tpublic int two() { return 2; }\n}\n' > src/main/java/demo/B.java
          git add . && git commit -q -m init
          python ../.apm/skills/agent-graph/install.py --repo . --home "$RUNNER_TEMP/ag"
          test -f .agent-knowledge/graph.json
          grep -q "agent-graph:begin" AGENTS.md
          python .agent-knowledge/kg.py show demo.B > show.txt
          grep -q "two" show.txt
          python ../.apm/skills/agent-graph/install.py --repo . --home "$RUNNER_TEMP/ag"
          python ../.apm/skills/agent-graph/install.py --repo . --uninstall
          test ! -e .agent-knowledge
      - name: Python repository smoke test
        shell: bash
        run: |
          mkdir pyproj && cd pyproj && git init -q
          mkdir -p pkg
          printf 'class B:\n    def two(self):\n        return 2\n' > pkg/b.py
          printf 'from .b import B\n\n\ndef one():\n    return B().two()\n' > pkg/a.py
          touch pkg/__init__.py
          git add . && git commit -q -m init
          python ../.apm/skills/agent-graph/install.py --repo . --home "$RUNNER_TEMP/ag2"
          python .agent-knowledge/kg.py callers two > callers.txt
          grep -q "pkg.a#one" callers.txt
      - name: TypeScript repository smoke test
        shell: bash
        run: |
          mkdir tsproj && cd tsproj && git init -q
          mkdir -p src
          printf 'export class B {\n  two() { return 2; }\n}\n' > src/b.ts
          printf 'import { B } from "./b";\n\nexport function one() {\n  return new B().two();\n}\n' > src/a.ts
          git add . && git commit -q -m init
          python ../.apm/skills/agent-graph/install.py --repo . --home "$RUNNER_TEMP/ag3"
          python .agent-knowledge/kg.py callers two > callers.txt
          grep -q "src.a#one" callers.txt
