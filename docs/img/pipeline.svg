<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="How the graph is built"><title>How the graph is built</title><style>
:root{--bg:#fbfaf7;--fg:#1d2330;--mut:#6b7385;--line:#c9cdd6;--box:#ffffff;--hi:#1f7a5a;--med:#b7791f;--acc:#2f5fd0;--accbg:#e8eefc;--grid:#e6e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e8eaf0;--mut:#9aa2b5;--line:#3a4152;--box:#1c212c;--hi:#4cc29a;--med:#e2a93b;--acc:#7aa2ff;--accbg:#1f2a47;--grid:#262c3a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg);font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mut{fill:var(--mut)}.h{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;fill:var(--mut)}
.box{fill:var(--box);stroke:var(--line)}.root{fill:var(--accbg);stroke:var(--acc)}
.hi{stroke:var(--hi);fill:none;stroke-width:1.6}.med{stroke:var(--med);fill:none;stroke-width:1.6;stroke-dasharray:5 4}
.bg{fill:var(--bg)}
</style><rect class="bg" width="1000" height="176" rx="10"/><rect class="box" x="24" y="34" width="156" height="92" rx="8"/><text x="38" y="62" style="font-weight:600">Source files</text><text class="mut" x="38" y="84">Java  Python  TS / JS</text><rect class="box" x="214" y="34" width="156" height="92" rx="8"/><text x="228" y="62" style="font-weight:600">Extractors</text><text class="mut" x="228" y="84">tree-sitter, Python ast</text><path class="hi" d="M184 80 L209 80"/><path class="hi" d="M203 74 L209 80 L203 86"/><rect class="root" x="404" y="34" width="156" height="92" rx="8"/><text x="418" y="62" style="font-weight:600">Claims</text><text class="mut" x="418" y="84">one fact per line,</text><text class="mut" x="418" y="101">file + line + tag</text><path class="hi" d="M374 80 L399 80"/><path class="hi" d="M393 74 L399 80 L393 86"/><rect class="box" x="594" y="34" width="156" height="92" rx="8"/><text x="608" y="62" style="font-weight:600">Graph</text><text class="mut" x="608" y="84">graph.json</text><path class="hi" d="M564 80 L589 80"/><path class="hi" d="M583 74 L589 80 L583 86"/><rect class="box" x="784" y="34" width="156" height="92" rx="8"/><text x="798" y="62" style="font-weight:600">For agents</text><text class="mut" x="798" y="84">kg command</text><text class="mut" x="798" y="101">markdown notes</text><text class="mut" x="798" y="118">AGENTS.md block</text><path class="hi" d="M754 80 L779 80"/><path class="hi" d="M773 74 L779 80 L773 86"/><text class="mut" x="24" y="156">No language model is involved. The same source always produces the same claims.</text></svg>