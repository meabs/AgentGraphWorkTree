<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="Token cost with the graph relative to no graph"><title>Token cost with the graph relative to no graph</title><style>
:root{--bg:#fbfaf7;--fg:#1d2330;--mut:#6b7385;--line:#c9cdd6;--box:#ffffff;--hi:#1f7a5a;--med:#b7791f;--acc:#2f5fd0;--accbg:#e8eefc;--grid:#e6e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e8eaf0;--mut:#9aa2b5;--line:#3a4152;--box:#1c212c;--hi:#4cc29a;--med:#e2a93b;--acc:#7aa2ff;--accbg:#1f2a47;--grid:#262c3a}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg);font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.mut{fill:var(--mut)}.h{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;fill:var(--mut)}
.box{fill:var(--box);stroke:var(--line)}.root{fill:var(--accbg);stroke:var(--acc)}
.hi{stroke:var(--hi);fill:none;stroke-width:1.6}.med{stroke:var(--med);fill:none;stroke-width:1.6;stroke-dasharray:5 4}
.bg{fill:var(--bg)}
</style><rect class="bg" width="880" height="352" rx="10"/><text class="h" x="24" y="26">Tokens per question with the graph, as a % of no graph (lower is better)</text><text class="mut" x="430.0" y="48">100% = no graph</text><text x="24" y="82">Java, large repo (Codex)</text><rect x="230" y="62" width="100.8" height="16" rx="3" fill="var(--acc)"/><text class="mono" x="338.8" y="75">42%</text><text x="24" y="134">Small Python/TS repos</text><rect x="230" y="114" width="220.79999999999998" height="16" rx="3" fill="var(--acc)"/><text class="mono" x="458.79999999999995" y="127">92% Claude Code</text><rect x="230" y="134" width="280.8" height="16" rx="3" fill="var(--med)"/><text class="mono" x="518.8" y="147">117% Codex</text><text x="24" y="186">Large Python/TS repos</text><rect x="230" y="166" width="264.0" height="16" rx="3" fill="var(--acc)"/><text class="mono" x="502.0" y="179">110% Claude Code</text><rect x="230" y="186" width="278.4" height="16" rx="3" fill="var(--med)"/><text class="mono" x="516.4" y="199">116% Codex</text><text x="24" y="238">Multi-hop questions</text><rect x="230" y="218" width="249.6" height="16" rx="3" fill="var(--acc)"/><text class="mono" x="487.6" y="231">104% Claude Code</text><rect x="230" y="238" width="304.8" height="16" rx="3" fill="var(--med)"/><text class="mono" x="542.8" y="251">127% Codex</text><text x="24" y="290">With kg subclasses</text><rect x="230" y="270" width="252.0" height="16" rx="3" fill="var(--acc)"/><text class="mono" x="490.0" y="283">105% Claude Code</text><rect x="230" y="290" width="204.0" height="16" rx="3" fill="var(--med)"/><text class="mono" x="442.0" y="303">85% Codex</text><line x1="470.0" y1="54" x2="470.0" y2="316" stroke="var(--mut)" stroke-dasharray="3 3"/><text class="mut" x="24" y="340">Answers were correct in every arm. Java row: shopizer, 398k vs 953k tokens. Other rows: Claude Code and Codex, 2 to 4 runs per cell.</text></svg>